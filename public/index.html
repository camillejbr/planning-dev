<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Dev</title>
<style>html,body{margin:0}body{font-size:14px}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F3F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#141A2B; --muted:#5E6578; --faint:#8C92A3;
  --line:#DEE1E8; --line-strong:#C5CAD6; --accent:#3044D0; --accent-ink:#FFFFFF; --accent-soft:#E6E9FC;
  --sel:#3044D0; --warn:#B4540A; --warn-soft:#FDF0E3; --bad:#B42336; --bad-soft:#FCE8EB; --ok:#1E7A4C;
  --chip-s:72%; --chip-l:91%; --chip-bs:50%; --chip-bl:79%; --chip-ts:62%; --chip-tl:27%;
  --seg-s:58%; --seg-l:60%;
  --abs-bg:#ECEDF1; --abs-ink:#4B5163; --abs-stripe:#DCDEE5;
  --e-bg:#FBF1D9; --e-ink:#7A5608; --m-bg:#FBE7EC; --m-ink:#8E2440;
  --hol-bg:#E9EAEE; --hol-stripe:#DADCE3;
  --shadow:0 18px 50px -12px rgb(20 26 43 / .25), 0 2px 6px rgb(20 26 43 / .08);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F121A; --surface:#171B26; --surface-2:#1C2130; --ink:#E7E9F0; --muted:#9BA1B2; --faint:#6D7385;
    --line:#282E3D; --line-strong:#384055; --accent:#8C9BFF; --accent-ink:#0F121A; --accent-soft:#232A4D;
    --sel:#8C9BFF; --warn:#F0A35B; --warn-soft:#352514; --bad:#FF8A99; --bad-soft:#3A1A21; --ok:#6FD3A0;
    --chip-s:32%; --chip-l:23%; --chip-bs:34%; --chip-bl:34%; --chip-ts:75%; --chip-tl:82%;
    --seg-s:48%; --seg-l:52%;
    --abs-bg:#262B38; --abs-ink:#B7BCCA; --abs-stripe:#2F3545;
    --e-bg:#3A2F12; --e-ink:#F2C96A; --m-bg:#3D1C27; --m-ink:#F5A3B8;
    --hol-bg:#1F2330; --hol-stripe:#272C3A;
    --shadow:0 18px 50px -12px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F121A; --surface:#171B26; --surface-2:#1C2130; --ink:#E7E9F0; --muted:#9BA1B2; --faint:#6D7385;
  --line:#282E3D; --line-strong:#384055; --accent:#8C9BFF; --accent-ink:#0F121A; --accent-soft:#232A4D;
  --sel:#8C9BFF; --warn:#F0A35B; --warn-soft:#352514; --bad:#FF8A99; --bad-soft:#3A1A21; --ok:#6FD3A0;
  --chip-s:32%; --chip-l:23%; --chip-bs:34%; --chip-bl:34%; --chip-ts:75%; --chip-tl:82%;
  --seg-s:48%; --seg-l:52%;
  --abs-bg:#262B38; --abs-ink:#B7BCCA; --abs-stripe:#2F3545;
  --e-bg:#3A2F12; --e-ink:#F2C96A; --m-bg:#3D1C27; --m-ink:#F5A3B8;
  --hol-bg:#1F2330; --hol-stripe:#272C3A;
  --shadow:0 18px 50px -12px rgb(0 0 0 / .6), 0 2px 6px rgb(0 0 0 / .3);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
@media (max-width:600px){.app{padding-inline:16px}}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;font-variation-settings:"opsz" 60}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.live::before{background:var(--ok)}
.sync.local::before{background:var(--warn)}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--ground)}

/* Week navigator */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:14px;border-block:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arrow{width:36px;height:36px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:18px;line-height:1;display:grid;place-items:center}
.arrow:hover{border-color:var(--ink)}
.wlabel{display:flex;flex-direction:column;min-width:0}
.wlabel .wk{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.wlabel .range{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em;font-variation-settings:"opsz" 40;text-wrap:balance}
.rel{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line-strong)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Week grid */
.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:820px;table-layout:fixed}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;vertical-align:top}
.grid tbody tr:last-child th,.grid tbody tr:last-child td{border-bottom:0}
.grid td+td,.grid th+th,.grid th+td{border-left:1px solid var(--line)}
.grid col.who{width:170px}
.corner{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:12px 14px!important;vertical-align:bottom!important}
.dayhead{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;width:100%;padding:10px 12px;cursor:pointer}
.dayhead:hover .dname{color:var(--accent)}
.dayhead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dname{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dnum{font-family:var(--display);font-weight:700;font-size:17px;font-variation-settings:"opsz" 24}
.dayhead.today .dnum{color:var(--accent)}
.dayhead.today .dname::after{content:" · aujourd’hui";text-transform:none;letter-spacing:0;color:var(--accent)}
.hol{font-size:11px;color:var(--muted)}
.who-btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;width:100%;height:100%;padding:12px 14px;cursor:pointer}
.who-btn:hover .name{color:var(--accent)}
.who-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.name{font-weight:600;font-size:15px}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.meta .todo{color:var(--warn)}
.meta .over{color:var(--bad)}
.cell{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;min-height:74px;padding:9px 10px;cursor:pointer;position:relative}
.cell:hover{background:var(--surface-2)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--sel)}
.cell.holiday{background:repeating-linear-gradient(135deg,var(--hol-bg) 0 6px,var(--hol-stripe) 6px 12px)}
.cell.holiday.sel{box-shadow:inset 0 0 0 2px var(--sel)}
.cell.overload::after{content:"> 1 j";position:absolute;right:6px;bottom:5px;font-family:var(--mono);font-size:10px;color:var(--bad)}
.cell .plus{margin:auto;color:var(--faint);font-size:18px;opacity:0;transition:opacity .12s}
.cell:hover .plus,.cell:focus-visible .plus{opacity:1}
.cell .holtag{font-size:12px;color:var(--muted);font-weight:500}

.chip{--h:220;display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 8px;border-radius:6px;font-size:12.5px;font-weight:600;line-height:1.3;
  background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-ts) var(--chip-tl));border:1px solid hsl(var(--h) var(--chip-bs) var(--chip-bl));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.85}
.chip.abs{background:repeating-linear-gradient(135deg,var(--abs-bg) 0 5px,var(--abs-stripe) 5px 10px);color:var(--abs-ink);border-color:var(--line-strong)}
.chip.abs-TP{background:var(--abs-bg);border-style:dashed}
.chip.abs-M{background:var(--m-bg);color:var(--m-ink);border-color:transparent}

.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}

/* Summary */
.summary{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.summary{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 12px;font-variation-settings:"opsz" 24}
.load{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:8px 12px;align-items:center}
.load .pname{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;min-width:0}
.load .pname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{--h:220;flex:none;width:10px;height:10px;border-radius:3px;background:hsl(var(--h) var(--seg-s) var(--seg-l))}
.bar{height:22px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:hsl(var(--h) var(--chip-s) var(--chip-l));border:1px solid hsl(var(--h) var(--chip-bs) var(--chip-bl))}
.bar em{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:calc(100% - 12px)}
.load .num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.abslist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.abslist li{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.abslist .who{font-weight:600;min-width:62px}
.abslist .when{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.empty-note{color:var(--muted);font-size:13px;margin:0}

/* Overview */
.ov-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.ov{border-collapse:separate;border-spacing:0;min-width:100%}
.ov th,.ov td{padding:0}
.ov thead th{font-weight:500}
.ov .wkhead{padding:10px 6px 4px;text-align:left;border-left:1px solid var(--line)}
.ov .wkhead button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:0}
.ov .wkhead button:hover .r{color:var(--accent)}
.ov .wkhead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ov .wkhead .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.ov .wkhead .r{font-family:var(--display);font-weight:700;font-size:13.5px;white-space:nowrap}
.ov .dh{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:center;padding:2px 0 8px;border-bottom:1px solid var(--line)}
.ov .dh.first,.ov td.first{border-left:1px solid var(--line)}
.ov .dh.today{color:var(--accent);font-weight:600}
.ov tbody th{text-align:left;font-weight:600;font-size:13.5px;padding:6px 14px;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.ov thead th.corner{position:sticky;left:0;background:var(--surface);z-index:1}
.ov td{padding:3px 2px;border-bottom:1px solid var(--line)}
.ov tbody tr:last-child td,.ov tbody tr:last-child th{border-bottom:0}
.ov tbody th{border-bottom:1px solid var(--line)}
.ovc{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;width:30px;height:38px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.ovc:hover{box-shadow:0 0 0 2px var(--ink)}
.ovc:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ovc.holiday{background:repeating-linear-gradient(135deg,var(--hol-bg) 0 4px,var(--hol-stripe) 4px 8px)}
.seg{--h:220;flex:1 1 0;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:500;color:#fff;background:hsl(var(--h) var(--seg-s) var(--seg-l));min-height:0;overflow:hidden;letter-spacing:-.02em}
.seg.abs{background:repeating-linear-gradient(135deg,var(--abs-bg) 0 4px,var(--abs-stripe) 4px 8px);color:var(--abs-ink)}
.seg.abs-TP{background:var(--abs-bg)}
.seg.abs-M{background:var(--m-bg);color:var(--m-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Report */
.repbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:14px;border-block:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 13px;font-weight:500;font-size:13px}
.fchip:hover{border-color:var(--ink)}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tile .tl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .tv{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.tile.warn .tv{color:var(--warn)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.phead h2{margin:0}
.load.rep{grid-template-columns:minmax(90px,160px) minmax(0,1fr) auto}
.rep-wrap{overflow-x:auto}
table.rep-t{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.rep-t th,.rep-t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.rep-t th:first-child{text-align:left}
.rep-t thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rep-t td{font-family:var(--mono);font-size:13px}
.rep-t .pname{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.rep-t .tot{font-weight:600;background:var(--surface-2)}
.rep-t tfoot th,.rep-t tfoot td{border-bottom:0;border-top:2px solid var(--line-strong);font-weight:600}
.abslist .num{font-family:var(--mono);font-size:12px}

.tile .tv small{font-size:14px;color:var(--muted);font-weight:500}
.notice{margin:0 0 12px;padding:10px 12px;border-radius:9px;background:var(--warn-soft);color:var(--ink);font-size:13px}
.notice.bad{background:var(--bad-soft)}
.muted{color:var(--faint)}
.gap0{color:var(--ok);font-weight:600}
.gapsm{color:var(--muted)}
.gapbig{color:var(--warn);font-weight:600}
.rep-t .sub{display:block;font-size:9.5px;letter-spacing:.04em;color:var(--faint);text-transform:none;font-weight:500}
.rep-t.cmp td b{font-weight:600}
.rep-t.cmp td .p{color:var(--faint);font-size:11.5px}
.rep-t.cmp td.hl{background:var(--warn-soft)}
.rep-t.cmp td.hl b{color:var(--warn)}
.rep-t .barcol{width:34%;min-width:140px}
.dual{--h:220;display:flex;flex-direction:column;gap:3px}
.dual i{display:block;height:8px;border-radius:3px;min-width:0}
.dual .bp{border:1.5px solid hsl(var(--h) var(--seg-s) var(--seg-l));background:transparent}
.dual .br{background:hsl(var(--h) var(--seg-s) var(--seg-l))}
.lg{display:inline-flex;align-items:center;gap:5px;text-transform:none;letter-spacing:0}
.lg i{width:14px;height:8px;border-radius:2px;display:inline-block}
.lg .lp{border:1.5px solid var(--muted)}.lg .lr{background:var(--muted);margin-left:6px}
.dot.other{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px);border:1px solid var(--faint)}
.rep-t.act td{padding:4px 6px}
.actin{width:72px;text-align:right;font-family:var(--mono);font-size:13px;padding:5px 8px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.modal.wide{width:min(660px,calc(100% - 32px));max-height:calc(100% - 40px);display:flex;flex-direction:column}
.modal .mbody{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal .mbody h3{margin:6px 0 0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.modal.wide>.foot{padding:14px 20px;border-top:1px solid var(--line)}
.modal textarea{resize:vertical;width:100%}
.modal .mono,.mono{font-family:var(--mono);font-size:12px}
.modal label.short{max-width:220px}
.maprows{display:flex;flex-direction:column;gap:6px}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.maprow .src{display:flex;flex-direction:column;font-weight:600;font-size:13px;min-width:0;overflow-wrap:anywhere}
.maprow .src small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:11px}
.maprow .arr{color:var(--faint)}
.maprow.unmapped select{border-color:var(--warn)}
.prev{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.prow{display:grid;grid-template-columns:90px 60px minmax(0,1fr);gap:10px;font-size:13px}
.prow .muted{font-size:12px;color:var(--muted)}
.hpdrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:600}
.hin{display:inline-flex;align-items:center;gap:4px}
.hin .u{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rep-t.act .eq{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:14px}
.login{position:fixed;inset:0;z-index:50;background:var(--ground);display:grid;place-items:center;padding-inline:16px}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{margin:0;font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.login-card p{margin:0;color:var(--muted)}
.login-card label{font-size:12px;font-weight:600;color:var(--muted);margin-top:6px}
.cdp{--h:220;font-style:normal;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.02em;padding:0 4px;border-radius:4px;margin-left:2px;

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Planning Dev</h1>
      <span class="sync" id="sync">Connexion…</span>
      <button class="btn ghost" id="lock" hidden>Verrouiller</button>
          </div>
    <div class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" id="tab-week" data-act="view" data-view="plan" aria-selected="true">Planning</button>
      <button role="tab" id="tab-rep" data-act="view" data-view="report" aria-selected="false">Bilan du mois</button>
      <button role="tab" id="tab-set" data-act="view" data-view="settings" aria-selected="false">Équipe &amp; projets</button>
    </div>
  </header>

  <section class="weekbar" id="weekbar">
    <div class="nav">
      <button class="arrow" data-act="prev" aria-label="Semaine précédente">‹</button>
      <div class="wlabel"><span class="wk" id="wk"></span><span class="range" id="range"></span></div>
      <button class="arrow" data-act="next" aria-label="Semaine suivante">›</button>
      <span class="rel" id="rel"></span>
    </div>
    <div class="actions" id="actions">
      <div class="segctl" role="group" aria-label="Affichage du planning"><button data-act="view" data-view="week" id="mode-week">Semaine</button><button data-act="view" data-view="overview" id="mode-ov">6 semaines</button></div>
      <div class="segctl" role="group" aria-label="Point de vue"><button data-act="persp" data-v="dev" id="persp-dev">Développeurs</button><button data-act="persp" data-v="cdp" id="persp-cdp">CDP</button></div>
      <button class="btn ghost" data-act="thisweek">Cette semaine</button>
      <button class="btn" data-act="copyprev" id="btn-copy">Reprendre la semaine précédente</button>
      <button class="btn primary" data-act="absence">Poser une absence</button>
    </div>
  </section>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden data-act="closeall"></div>
<aside class="drawer" id="editor" hidden aria-labelledby="ed-title" role="dialog"></aside>

    <label>Qui<select class="field" id="abs-dev"></select></label>
    <label>Motif<select class="field" id="abs-type"></select></label>
    <div class="two">
      <label>Du<input class="field" type="date" id="abs-from" required></label>
      <label>Au (inclus)<input class="field" type="date" id="abs-to" required></label>

    <div class="foot"><button type="button" class="btn ghost" data-act="closeall">Annuler</button><button type="submit" class="btn primary">Enregistrer l’absence</button></div>
  </form>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
/* ---------- Constants ---------- */
const DEFAULT_CONFIG = {
  devs: [
    {id:"molka",name:"Molka"},{id:"omar",name:"Omar"},{id:"remy",name:"Rémy"},
    {id:"yousra",name:"Yousra"},{id:"walid",name:"Walid"}
  ],
  projects: [
    {id:"gouv",name:"Portail gouv",hue:222},{id:"blc",name:"BLC",hue:355},{id:"msi",name:"MSI",hue:268},
    {id:"audio",name:"Audiodescription",hue:325},{id:"fapi",name:"FAPI",hue:140},{id:"dsfr",name:"DSFR",hue:198},
    {id:"franceterme",name:"France Terme",hue:36},{id:"selenium",name:"Selenium",hue:95},{id:"infolettre",name:"Infolettre",hue:55},
    {id:"sem",name:"SEM",hue:172},{id:"datagouv",name:"DATA GOUV",hue:245},{id:"archeo",name:"Archéo",hue:18},{id:"cluny",name:"Cluny",hue:292}
  ]
};
const HUES = [222,355,268,325,140,198,36,95,55,172,245,18,292,0,120,210];
const ABS = {
  CP:{label:"Congé",code:"CP"}, TP:{label:"Temps partiel",code:"TP"}, E:{label:"École",code:"E"},
  M:{label:"Maladie",code:"M"}, F:{label:"Formation",code:"F"}, A:{label:"Autre absence",code:"Abs"}
};
const DAYS_LONG = ["lundi","mardi","mercredi","jeudi","vendredi"];
const DAYS_SHORT = ["lun.","mar.","mer.","jeu.","ven."];
const MONTHS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (s,n) => { const d=parse(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const mondayOf = s => addDays(s, -((parse(s).getUTCDay()+6)%7));
const dayIdx = s => Math.round((parse(s)-parse(mondayOf(s)))/864e5);
const todayIso = () => { const t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); };
const isoWeek = s => { const d=parse(s); d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3); const y=d.getUTCFullYear(); const j4=new Date(Date.UTC(y,0,4)); return 1+Math.round(((d-j4)/864e5-3+((j4.getUTCDay()+6)%7))/7); };
const dm = s => { const d=parse(s); return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]; };
const holCache = {};
function holidays(y){
  if (holCache[y]) return holCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
    h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const easter = iso(new Date(Date.UTC(y,mo-1,da)));
  return holCache[y] = {
    [y+"-01-01"]:"Jour de l’an",[addDays(easter,1)]:"Lundi de Pâques",[y+"-05-01"]:"Fête du travail",[y+"-05-08"]:"8 mai 1945",
    [addDays(easter,39)]:"Ascension",[addDays(easter,50)]:"Lundi de Pentecôte",[y+"-07-14"]:"Fête nationale",[y+"-08-15"]:"Assomption",
    [y+"-11-01"]:"Toussaint",[y+"-11-11"]:"Armistice",[y+"-12-25"]:"Noël"
  };
}
const holiday = s => holidays(+s.slice(0,4))[s];

/* ---------- State ---------- */
let db = null, mode = "connecting", readOnly = false;
let config = DEFAULT_CONFIG;
let weeks = {};
let view = "week";
const t0 = todayIso();
let weekStart = addDays(mondayOf(t0), [4,5,6].includes(dayIdx(t0)) || parse(t0).getUTCDay()===0 ? 7 : 0);
let sel = new Set();
let draft = [];
let addVal = 1;
let confirmRemove = null;
let repMonth = t0.slice(0,7);
let repDev = "all";
let planMode = "week";
let persp = "dev", repCdp = "all";
let repEdit = false;
let actuals = {};
let rmConfig = {hoursPerDay:7.5, users:[], projects:[]};
let imp = null;
const created = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtV = v => v === 0.5 ? "½" : String(v).replace(".", ",");
const devs = () => config.devs.filter(d => !d.archived);
const projects = () => config.projects.filter(p => !p.archived);
const proj = id => config.projects.find(p => p.id === id);
const cdps = () => (config.cdps || []).filter(c => !c.archived);
const isCdp = id => (config.cdps || []).some(c => c.id === id);
const devName = id => ([...config.devs, ...(config.cdps || [])].find(d => d.id === id) || {name:id}).name;
const initials = name => { const w = String(name).trim().split(/[\s-]+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : String(name).slice(0,2)).toUpperCase(); };
const offDay = (id, date) => cellOf(id, date).reduce((s,e) => s + (e.abs ? e.v : 0), 0) >= 1;
/* Qui gère le projet ce jour-là : le CDP titulaire, ou le suppléant si le titulaire est absent. */
function cdpFor(pid, date){
  const p = proj(pid); if (!p || !p.cdp) return null;
  if (!offDay(p.cdp, date)) return {id:p.cdp, backup:false};
  if (p.cdp2 && !offDay(p.cdp2, date)) return {id:p.cdp2, backup:true, for:p.cdp};
  return {id:p.cdp, backup:false, absent:true};
}
function cdpTag(pid, date){
  const c = cdpFor(pid, date); if (!c) return "";
  const n = devName(c.id);
  const t = c.backup ? `CDP : ${n} (remplace ${devName(c.for)}, absent·e)` : c.absent ? `CDP : ${n}, absent·e et pas de suppléant disponible` : `CDP : ${n}`;
  return `<i class="cdp${c.backup?" backup":""}${c.absent?" gone":""}" title="${esc(t)}">${esc(initials(n))}</i>`;
}

function cellOf(dev, date){
  const w = weeks[mondayOf(date)];
  const c = w && w.days && w.days[dev] && w.days[dev][dayIdx(date)];
  return Array.isArray(c) ? c : [];
}
function stats(entries, date){
  let abs=0, pr=0;
  for (const e of entries) { if (e.abs) abs += e.v; else pr += e.v; }
  const cap = holiday(date) ? 0 : Math.max(0, 1-abs);
  return {abs, pr, cap, over: abs+pr > 1};
}

/* ---------- Rendering ---------- */
function chip(e, date){
  if (e.abs) { const a = ABS[e.abs] || {label:e.abs}; return `<span class="chip abs abs-${esc(e.abs)}">${esc(a.label)}${e.v<1?" <b>½</b>":""}</span>`; }
  const p = proj(e.p);

function managedDay(cid, d){

    if (!e.p) continue;

    const o = m[e.p] ??= {pid:e.p, devs:[], v:0, backup:!!(c && c.backup), gone:!!(c && c.absent)};
    o.devs.push({id:dv.id, v:e.v}); o.v += e.v;

}

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }

}
function parseHours(s){

      else { sel = new Set([k]); openEditor(k); }
      break;
    }
    case "selrow": {
      const dv = el.dataset.dev, days = [0,1,2,3,4].map(i => addDays(weekStart,i)).filter(d => !holiday(d));
      sel = new Set(days.map(d => dv+"|"+d));
      if (el.dataset.keep && !$("#editor").hidden) render(); else if (days.length) openEditor(dv+"|"+days[0]);
      break;
    }
    case "selcol": { const d = el.dataset.date; sel = new Set(devs().map(x => x.id+"|"+d)); if (sel.size) openEditor([...sel][0]); break; }
    case "gotoweek": weekStart = el.dataset.week; view = planMode = "week"; render(); break;
    case "gotocell": { const k = el.dataset.key; weekStart = mondayOf(k.split("|")[1]); view = planMode = "week"; sel = new Set([k]); openEditor(k); break; }
    case "closeall": closeAll(); break;
    case "addval": addVal = +el.dataset.v; renderEditor(); break;
    case "pickp": pick("p", el.dataset.id); break;
    case "picka": pick("abs", el.dataset.id); break;
    case "dval": { const e = draft[+el.dataset.i]; e.v = e.v===1 ? 0.5 : 1; renderEditor(); break; }
    case "drm": draft.splice(+el.dataset.i,1); renderEditor(); break;
    case "save": { const n = sel.size; writeCells([...sel].map(k => { const [dv,date]=k.split("|"); return {dev:dv,date,entries:draft.map(e=>({...e}))}; })); closeAll(); toast(n>1?`${n} cases enregistrées`:"Case enregistrée"); break; }
    case "clearcells": { const n = sel.size; writeCells([...sel].map(k => { const [dv,date]=k.split("|"); return {dev:dv,date,entries:[]}; })); closeAll(); toast(n>1?`${n} cases vidées`:"Case vidée"); break; }
    case "copyprev": {
      const prev = addDays(weekStart,-7), changes = [];
      for (const dv of devs()) for (let i=0;i<5;i++) {
        const d = addDays(weekStart,i); if (holiday(d) || cellOf(dv.id,d).length) continue;
        const src = cellOf(dv.id, addDays(prev,i)).filter(e => e.p);
        if (src.length) changes.push({dev:dv.id, date:d, entries:src.map(e => ({...e}))});
      }
      if (!changes.length) toast("Rien à reprendre : les cases sont déjà remplies ou la semaine précédente n’a pas de projet.");
      else { writeCells(changes); toast(`${changes.length} case${changes.length>1?"s":""} reprise${changes.length>1?"s":""} de la semaine ${isoWeek(prev)} (les cases déjà remplies n’ont pas bougé)`); }
      break;
    }
    case "absence": openAbsence(); break;
    case "mprev": case "mnext": { let [y,m] = repMonth.split("-").map(Number); m += act==="mnext" ? 1 : -1; if (m<1){m=12;y--;} if (m>12){m=1;y++;} repMonth = y+"-"+pad(m); render(); break; }
    case "repdev": repDev = el.dataset.id; render(); break;
    case "repcdp": repCdp = el.dataset.id; render(); break;
    case "persp": persp = el.dataset.v; closeAll(); break;
    case "act-edit": repEdit = !repEdit; render(); break;
    case "imp-open": openImport(); break;
    case "imp-back": imp.step = 1; imp.error = ""; renderImport(); break;
    case "imp-analyze": {
      imp.text = $("#imp-text").value; imp.hpd = Math.max(1, parseFloat(String($("#imp-hpd").value).replace(",", ".")) || 7.5);
      const res = analyzeImport(imp.text);
      if (res.error) { imp.error = res.error; renderImport(); break; }
      imp.data = res; imp.step = 2; imp.error = ""; renderImport(); $("#imp").scrollTop = 0; break;
    }
    case "imp-save": saveImport(); break;
    case "copyrep": {
      const txt = reportTSV();
      const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; ta.className = "field"; ta.style.cssText = "width:100%;height:120px;margin-top:10px;font-family:var(--mono);font-size:12px"; el.closest(".panel").appendChild(ta); ta.select(); toast("Copie automatique impossible : le texte est sélectionné, faites ⌘C."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Tableau copié — collez-le dans Excel ou Google Sheets"), fallback); } catch { fallback(); }
      break;
    }
    case "ask-remove": confirmRemove = el.dataset.id; render(); break;
    case "cancel-remove": confirmRemove = null; render(); break;
    case "toc": {
      ev.preventDefault();
      const t = document.getElementById(el.dataset.target); if (!t) break;
      tocActive = el.dataset.target;
      document.querySelectorAll(".toc a").forEach(a => a.classList.toggle("on", a === el));
      t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
      break;
    }
    case "cdpabs-del": { const id = el.dataset.id, ds = el.dataset.dates.split(","); writeCells(ds.map(date => ({dev:id, date, entries:[]}))); toast(`Absence de ${devName(id)} supprimée`); break; }
    case "archive-cdp": case "restore-cdp": { const c = cloneConfig(); c.cdps.find(d => d.id===el.dataset.id).archived = act==="archive-cdp"; confirmRemove=null; saveConfig(c); break; }
    case "archive-dev": case "restore-dev": { const c = cloneConfig(); c.devs.find(d => d.id===el.dataset.id).archived = act==="archive-dev"; confirmRemove=null; saveConfig(c); break; }
    case "archive-proj": case "restore-proj": { const c = cloneConfig(); c.projects.find(p => p.id===el.dataset.id).archived = act==="archive-proj"; confirmRemove=null; saveConfig(c); break; }
    case "hue": { const c = cloneConfig(); const p = c.projects.find(x => x.id===el.dataset.id); p.hue = HUES[(HUES.indexOf(p.hue)+1) % HUES.length]; saveConfig(c); break; }
  }
});
document.addEventListener("change", ev => {
  const el = ev.target; const act = el.dataset && el.dataset.act; if (!act) return;
  if (act === "imp-map") { (el.dataset.kind==="u" ? imp.data.uMap : imp.data.pMap)[el.dataset.key] = el.value; const st = $("#imp").scrollTop; renderImport(); $("#imp").scrollTop = st; return; }
  if (act === "imp-file") {
    const file = el.files && el.files[0]; if (!file) return;
    const read = enc => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsText(file, enc); });
    read("utf-8").then(t => t.includes("\uFFFD") ? read("windows-1252") : t).then(t => { imp.text = t; $("#imp-text").value = t; toast(`Fichier chargé : ${file.name}`); }, () => toast("Lecture du fichier impossible."));
    return;
  }
  if (act === "act-in") {
    const hpd = rmConfig.hoursPerDay || 7.5, raw = el.value.trim(), h = raw === "" ? 0 : parseHours(raw);
    if (!isFinite(h) || h < 0 || h > 31*hpd) { toast("Saisissez un nombre d’heures (ex. 15, 7,5 ou 7h30)."); el.value = ""; return; }
    const days = Math.round(h/hpd*1000)/1000;
    const eq = el.closest("td").querySelector(".eq"); if (eq) eq.textContent = days ? "= "+num(days)+" j" : "";
    saveActual(el.dataset.dev, el.dataset.pid, days); return;
  }
  if (act === "hpd") {
    const v = parseHours(el.value);
    if (!isFinite(v) || v < 1 || v > 12) { toast("Durée d’une journée : entre 1 et 12 heures (ex. 7,5)."); render(); return; }
    rmConfig = {...rmConfig, hoursPerDay: v}; render();
    if (db) enqueue("config/redmine", () => withRetry(() => db.doc("config/redmine").set(rmConfig)).catch(onWriteError));
    toast(`1 jour = ${num(v)} h — s’applique aux prochaines saisies et imports`); return;
  }
  if (act === "proj-cdp") {
    const c = cloneConfig(), p = c.projects.find(x => x.id===el.dataset.id), f = el.dataset.field;
    if (el.value) p[f] = el.value; else delete p[f];
    if (p.cdp && p.cdp === p.cdp2) { delete p[f==="cdp"?"cdp2":"cdp"]; toast("Le titulaire et le suppléant doivent être deux personnes différentes."); }
    saveConfig(c); return;
  }
  const name = el.value.trim(); if (!name) { render(); return; }
  if (act==="rename-cdp") { const c = cloneConfig(); const d = c.cdps.find(x => x.id===el.dataset.id); if (d.name===name) return; d.name = name; saveConfig(c); toast("Nom mis à jour"); return; }
  const c = cloneConfig();
  if (act==="rename-dev") { const d = c.devs.find(x => x.id===el.dataset.id); if (d.name===name) return; d.name = name; saveConfig(c); toast("Prénom mis à jour"); }
  if (act==="rename-proj") { const p = c.projects.find(x => x.id===el.dataset.id); if (p.name===name) return; p.name = name; saveConfig(c); toast("Projet renommé"); }
});
document.addEventListener("submit", ev => {
  const f = ev.target; ev.preventDefault();
  if (f.dataset.form === "cdpabs") {
    const id = f.dataset.id, from = $("#cabs-from-"+id).value, to = $("#cabs-to-"+id).value, type = $("#cabs-type-"+id).value;
    if (!from || !to || to < from) { toast("La date de fin doit être après la date de début."); return; }
    const changes = [];
    for (let d = from; d <= to && changes.length < 260; d = addDays(d,1)) if (dayIdx(d) <= 4 && !holiday(d)) changes.push({dev:id, date:d, entries:[{abs:type, v:1}]});
    if (!changes.length) { toast("Aucun jour ouvré dans cette période."); return; }
    writeCells(changes); toast(`${ABS[type].label} ajouté pour ${devName(id)} : ${changes.length} jour${changes.length>1?"s":""}`);
    return;
  }
  if (f.dataset.form === "cdp") { const v = $("#new-cdp").value.trim(); if (!v) return; const c = cloneConfig(); c.cdps = c.cdps || []; c.cdps.push({id:"cdp-"+slug(v,[...c.devs,...c.cdps].map(x => ({id:x.id.replace(/^cdp-/,"")}))), name:v}); saveConfig(c); toast(`${v} ajouté·e aux chefs de projet`); }
  if (f.dataset.form === "dev") { const v = $("#new-dev").value.trim(); if (!v) return; const c = cloneConfig(); c.devs.push({id:slug(v,c.devs), name:v}); saveConfig(c); toast(`${v} ajouté·e à l’équipe`); }
  if (f.dataset.form === "proj") { const v = $("#new-proj").value.trim(); if (!v) return; const c = cloneConfig(); const used = c.projects.map(p=>p.hue); const hue = HUES.find(h => !used.includes(h)) ?? Math.floor(Math.random()*360); c.projects.push({id:slug(v,c.projects), name:v, hue}); saveConfig(c); toast(`Projet « ${v} » ajouté`); }
  if (f.id === "abs-form") {
    const dv = $("#abs-dev").value, type = $("#abs-type").value, from = $("#abs-from").value, to = $("#abs-to").value, v = +$("#abs-dur").value;
    if (!from || !to || to < from) { toast("La date de fin doit être après la date de début."); return; }
    const changes = [];
    for (let d = from; d <= to; d = addDays(d,1)) {
      if (dayIdx(d) > 4 || holiday(d)) continue;
      let entries = [{abs:type, v}];
      if (v < 1) { const keep = cellOf(dv,d).filter(e => e.p); entries = entries.concat(keep.map(e => ({...e, v: 0.5/keep.length}))); }
      changes.push({dev:dv, date:d, entries});
      if (changes.length > 260) break;
    }
    if (!changes.length) { toast("Aucun jour ouvré dans cette période."); return; }
    writeCells(changes); closeAll();
    toast(`${ABS[type].label} posé pour ${devName(dv)} : ${changes.length} jour${changes.length>1?"s":""}`);
  }
});

function deepMerge(a, b){
  if (!a || typeof a !== "object" || Array.isArray(a) || !b || typeof b !== "object" || Array.isArray(b)) return b;
  const r = {...a};
  for (const [k,v] of Object.entries(b)) r[k] = k in r ? deepMerge(r[k], v) : v;
  return r;
}
function makeDb(sb){
  const cache = {}, listeners = {};
  const mapErr = e => ({code: (e && (e.code === "42501" || e.code === "PGRST301" || /jwt|permission|row-level/i.test(e.message||""))) ? "invalid_argument" : "unavailable", message: (e && e.message) || "erreur"});
  const emit = col => { for (const fn of listeners[col] || []) fn(); };
  const setLocal = (col, id, d) => { if (cache[col]) { cache[col].set(id, d); emit(col); } };
  async function load(col){
    const {data, error} = await sb.from("planning_docs").select("id,data").eq("collection", col);
    if (error) { console.warn(error); return; }
    cache[col] = new Map(data.map(r => [r.id, r.data])); emit(col);
  }
  const reloadAll = () => Object.keys(listeners).forEach(load);
  sb.channel("planning_docs")
    .on("postgres_changes", {event:"*", schema:"public", table:"planning_docs"}, p => {
      const row = (p.new && p.new.collection) ? p.new : p.old; if (!row || !cache[row.collection]) return;
      if (p.eventType === "DELETE") cache[row.collection].delete(row.id); else cache[row.collection].set(row.id, row.data);
      emit(row.collection);
    })
    .subscribe(status => { if (status === "SUBSCRIBED") reloadAll(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) reloadAll(); });
  const snap = (id, d) => ({id, exists: d !== undefined, data: () => d, metadata: {fromCache:false, hasPendingWrites:false}});
  function watch(col){ if (!listeners[col]) { listeners[col] = new Set(); load(col); } }
  function doc(path){
    const [col, id] = path.split("/");
    return {
      id, path,
      async get(){ const {data, error} = await sb.from("planning_docs").select("data").eq("collection", col).eq("id", id).maybeSingle(); if (error) throw mapErr(error); return snap(id, data ? data.data : undefined); },
      async set(d){ const {error} = await sb.from("planning_docs").upsert({collection:col, id, data:d, updated_at:new Date().toISOString()}); if (error) throw mapErr(error); setLocal(col, id, d); },
      async update(patch){
        const {error} = await sb.rpc("planning_merge", {p_collection:col, p_id:id, p_patch:patch});
        if (error) throw mapErr(error);
        const cur = cache[col] && cache[col].get(id); if (cur) setLocal(col, id, deepMerge(cur, patch));
      },
      onSnapshot(next){ watch(col); const fn = () => next(snap(id, cache[col] && cache[col].get(id))); listeners[col].add(fn); if (cache[col]) fn(); return () => listeners[col].delete(fn); }
    };
  }
  function collection(col){
    return {
      onSnapshot(next){
        watch(col);
        const fn = () => { const docs = [...cache[col].entries()].sort((a,b) => a[0].localeCompare(b[0])).map(([id,d]) => snap(id,d)); next({docs, size:docs.length, empty:!docs.length}); };
        listeners[col].add(fn); if (cache[col]) fn(); return () => listeners[col].delete(fn);
      }
    };
  }
  return {doc, collection};
}
